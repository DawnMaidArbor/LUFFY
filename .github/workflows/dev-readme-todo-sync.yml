name: dev-readme-todo-sync

on:
  workflow_dispatch: {}
  push:
    branches: [dev]

permissions:
  contents: write
  issues: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile README TODO list and clean-update dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          FEATURE_SHA: 7463fefd0f55ae2ba0b919e06527588022893495
          TEMP_BRANCH: todo-sync-probe-delete
          DIFF_BASE: origin/main
          DIFF_HEAD: HEAD
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/luffy-todo-sync"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          echo "Cloning ${REPO_NAME}"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git" "$WORK/repo"
          cd "$WORK/repo"
          git fetch --quiet --no-tags origin main dev
          OLD_SHA="$(git rev-parse origin/dev)"
          echo "current_remote_dev=${OLD_SHA}; clean_parent=${FEATURE_SHA}"
          git show "origin/dev:.github/scripts/sync_dev_readme.py" > "$WORK/sync_dev_readme.py"
          python3 -m py_compile "$WORK/sync_dev_readme.py"
          git worktree add --quiet --detach "$WORK/clean" "$FEATURE_SHA"
          cd "$WORK/clean"
          python3 "$WORK/sync_dev_readme.py"
          if git diff --quiet -- README.md; then
            echo "ERROR: reconciler produced no README change; refusing branch rewrite."
            exit 2
          fi
          git add README.md
          git -c user.name="DawnMaidArbor" \
              -c user.email="317157599+DawnMaidArbor@users.noreply.github.com" \
              commit -m "docs(readme): sync TODO list after dev implementation"
          NEW_SHA="$(git rev-parse HEAD)"
          PARENT_SHA="$(git rev-parse HEAD^)"
          echo "prepared_commit=${NEW_SHA} parent=${PARENT_SHA}"
          test "$PARENT_SHA" = "$FEATURE_SHA"
          test "$(git show --name-only --format= HEAD | tail -n +2 | sed '/^$/d' | tr '\n' ',')" = "README.md,"
          git push origin "HEAD:refs/heads/dev" --force-with-lease="dev:${OLD_SHA}"
          echo "DEV_FORCE_UPDATED=${NEW_SHA}"
          git push origin --delete "$TEMP_BRANCH" || true
          echo "TEMP_BRANCH_DELETE_ATTEMPTED=${TEMP_BRANCH}"
