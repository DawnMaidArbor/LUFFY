name: dev-readme-todo-sync
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch dev and report README structure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git config user.name "DawnMaidArbor"
          git config user.email "317157599+DawnMaidArbor@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin main dev
          git checkout -q -f -B dev origin/dev
          echo "DEV_SHA=$(git rev-parse HEAD)"
          echo "CHANGED_FILES"
          git diff --name-status origin/main origin/dev
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('README.md').read_text(encoding='utf-8')
          lines=s.splitlines()
          print('README_BYTES',len(s.encode()),'LINES',len(lines),'TITLE_COUNT',s.count('### 📝 Complete TODO List'))
          ti=next((i for i,l in enumerate(lines) if l.strip()=='### 📝 Complete TODO List'),-1)
          print('TITLE_INDEX_ONE_BASED',ti+1)
          for j in range(max(0,ti-2),min(len(lines),ti+18)):
              print(f'R{j+1}: {lines[j][:260]!r}')
          heads=[(i+1,l) for i,l in enumerate(lines) if re.match(r'^#{1,6}\s+',l)]
          print('HEADINGS_AFTER_TITLE')
          for n,l in heads:
              if n>ti+1: print(f'H{n}: {l[:180]!r}')
          bullets=[(i+1,l) for i,l in enumerate(lines) if re.match(r'^\s*-\s*\[[ xX]\]\s+\*\*.+?:\d+\*\*',l)]
          print('BULLET_COUNT_ANYWHERE',len(bullets),'FIRST',bullets[:3],'LAST',bullets[-3:])
          insec=[]
          end=len(lines)
          for i in range(ti+1,len(lines)):
              if re.match(r'^#{1,3}\s+',lines[i]): end=i; break
          for i in range(ti+1,end):
              if re.match(r'^\s*-\s*\[[ xX]\]\s+\*\*.+?:\d+\*\*',lines[i]): insec.append((i+1,lines[i]))
          print('SECTION_END_ONE_BASED',end+1,'SECTION_BULLETS',len(insec),'SECTION_NONBULLET_BETWEEN')
          bs=[n for n,_ in insec]
          for i in range(min(bs)-1,max(bs)):
              if lines[i].strip() and not re.match(r'^\s*-\s*\[[ xX]\]\s+\*\*.+?:\d+\*\*',lines[i]): print(f'N{i+1}: {lines[i][:220]!r}')
          for p in subprocess.check_output(['git','diff','--name-only','origin/main','origin/dev'],text=True).splitlines():
              if p.endswith('.py'):
                  print('PY_DIFF_FILE',p)
                  try:
                      src=Path(p).read_text(encoding='utf-8')
                      todos=[(i+1,l.strip()) for i,l in enumerate(src.splitlines()) if re.search(r'#\s*TODO\b',l)]
                      print('CURRENT_TODO_COUNT',len(todos))
                      for n,l in todos: print(f'T{n}: {l[:240]}')
                  except Exception as e: print('READ_ERROR',repr(e))
          PY
